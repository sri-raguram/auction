<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tecnical Cricket Championship 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.14 0.02 262);
    --panel:oklch(0.19 0.022 262);
    --panel-2:oklch(0.245 0.02 262);
    --border:oklch(0.29 0.03 262);
    --border-soft:oklch(0.24 0.025 262);
    --text:oklch(0.97 0.01 262);
    --text-dim:oklch(0.70 0.02 262);
    --text-faint:oklch(0.54 0.02 262);
    --gold:oklch(0.80 0.16 85);
    --gold-soft:oklch(0.30 0.06 85 / 0.35);
    --gold-line:oklch(0.5 0.13 85 / 0.5);
    --live:oklch(0.63 0.21 25);
    --live-soft:oklch(0.26 0.09 25 / 0.5);
    --live-line:oklch(0.5 0.18 25 / 0.6);
    --success:oklch(0.72 0.16 145);
    --success-soft:oklch(0.26 0.06 145 / 0.5);
    --success-line:oklch(0.5 0.12 145 / 0.6);
    --t-blue:oklch(0.68 0.14 250);
    --t-orange:oklch(0.68 0.14 35);
    --t-green:oklch(0.68 0.14 155);
    --t-purple:oklch(0.68 0.14 305);
    --t-teal:oklch(0.68 0.14 195);
    --t-amber:oklch(0.68 0.14 75);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;background:var(--bg);}
  body{
    color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-size:15px;
    background:
      radial-gradient(1100px 560px at 50% -12%, oklch(0.30 0.06 85 / 0.10), transparent 60%),
      var(--bg);
  }
  h1,h2,h3{margin:0;text-wrap:balance;}
  .disp{font-family:'Oswald','Arial Narrow',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  button:disabled{cursor:not-allowed;opacity:0.45;}
  button:focus-visible,[data-action]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:7px;height:7px;}
  ::-webkit-scrollbar-thumb{background:oklch(0.36 0.03 262);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  a{color:var(--gold);text-decoration:none;}

  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  /* ---- flash overlay (sold / unsold) ---- */
  #flash-overlay{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:80;padding-top:8vh;}
  .flash-card{display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:14px;padding:30px 56px;position:relative;box-shadow:0 24px 64px oklch(0.05 0.02 262 / 0.55);}
  .flash-sold{background:linear-gradient(180deg,oklch(0.24 0.07 145 / 0.97),oklch(0.17 0.03 262 / 0.98));border:1px solid var(--success-line);animation:flashSoldIn 550ms cubic-bezier(.2,1.4,.4,1) both;}
  .flash-unsold{background:oklch(0.20 0.02 262 / 0.98);border:1px solid var(--border);animation:flashUnsoldIn 420ms ease-out both;}
  .flash-eyebrow{font-size:13px;letter-spacing:0.16em;font-weight:700;}
  .flash-sold .flash-eyebrow{color:var(--success);}
  .flash-unsold .flash-eyebrow{color:var(--text-faint);}
  .flash-name{font-family:'Oswald','Arial Narrow',sans-serif;font-size:42px;font-weight:600;color:var(--text);margin-top:8px;}
  .flash-sub{font-size:16px;color:var(--text-dim);margin-top:8px;}
  .flash-price{font-family:'Oswald','Arial Narrow',sans-serif;font-size:34px;font-weight:700;color:var(--gold);margin-top:6px;}
  @keyframes flashSoldIn{0%{opacity:0;transform:scale(0.75) translateY(-10px);}55%{opacity:1;transform:scale(1.05) translateY(0);}100%{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes flashUnsoldIn{0%{opacity:0;transform:translateY(-14px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes flashOut{to{opacity:0;transform:scale(0.96);}}
  .flash-out{animation:flashOut 320ms ease-in forwards;}
  .confetti-particle{position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:2px;animation:particleBurst 900ms cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes particleBurst{0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--rot)) scale(0.4);opacity:0;}}

  @keyframes bidPulse{0%{transform:scale(1);}35%{transform:scale(1.09);}100%{transform:scale(1);}}
  .bid-pulse{animation:bidPulse 550ms ease-out;display:inline-block;}

  /* ---- role gate ---- */
  #role-gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px;
  }
  .gate-card{
    width:min(680px,100%);background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:56px 52px;box-shadow:0 24px 64px oklch(0.05 0.02 262 / 0.45);
  }
  .gate-eyebrow{font-size:12px;letter-spacing:0.16em;color:var(--text-faint);text-align:center;}
  .gate-title{font-size:46px;font-weight:700;text-align:center;margin-top:12px;color:var(--text);}
  .gate-sub{font-size:15px;color:var(--text-dim);text-align:center;margin-top:10px;}
  .gate-section{margin-top:34px;}
  .gate-label{font-size:12px;letter-spacing:0.08em;color:var(--text-faint);margin-bottom:12px;}
  .gate-btn{
    width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:18px 22px;color:var(--text);font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .gate-btn:hover{border-color:var(--gold-line);background:oklch(0.27 0.03 262);}
  .gate-btn .arrow{color:var(--text-faint);}
  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .team-chip-btn{
    display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;padding:16px 18px;color:var(--text);font-size:15px;font-weight:600;
  }
  .team-chip-btn:hover{border-color:var(--gold-line);background:oklch(0.27 0.03 262);}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}

  /* ---- app shell ---- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  #topbar{
    flex:0 0 76px;display:flex;align-items:center;justify-content:space-between;
    padding:0 40px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:13px;}
  .brand-name{font-size:19px;font-weight:600;letter-spacing:0.04em;}
  .status-pill{display:flex;align-items:center;gap:8px;border-radius:4px;padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:0.06em;}
  .status-live{background:var(--live-soft);border:1px solid var(--live-line);color:oklch(0.75 0.18 25);}
  .status-idle{background:var(--panel-2);border:1px solid var(--border);color:var(--text-faint);}
  .status-done{background:var(--success-soft);border:1px solid var(--success-line);color:oklch(0.78 0.15 145);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .live .status-dot{animation:pulse 1.4s infinite;}
  .topbar-right{display:flex;align-items:center;gap:18px;}
  .role-label{font-size:13px;color:var(--text-dim);}
  .switch-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;}
  .switch-btn:hover{border-color:var(--gold-line);color:var(--text);}

  #view-root{flex:1;padding:26px 40px 36px;min-height:0;max-width:1760px;width:100%;margin:0 auto;}
  .loading{padding:80px;text-align:center;color:var(--text-faint);font-size:14px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 0 oklch(1 0 0 / 0.02) inset,0 6px 20px oklch(0.05 0.02 262 / 0.25);}
  .panel-head{padding:16px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-title{font-size:12px;font-weight:700;letter-spacing:0.08em;color:var(--text-faint);}

  .btn{border-radius:7px;padding:13px 22px;font-size:14px;font-weight:700;border:1px solid transparent;}
  .btn-gold{background:var(--gold);color:oklch(0.14 0.02 262);}
  .btn-gold:hover:not(:disabled){filter:brightness(1.06);}
  .btn-line{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-line:hover:not(:disabled){border-color:var(--gold-line);}
  .btn-danger-line{background:transparent;border:1.4px solid oklch(0.5 0.15 25 / 0.7);color:oklch(0.75 0.18 25);}
  .btn-danger{background:var(--live);color:oklch(0.98 0.01 25);}
  .btn-danger:hover:not(:disabled){filter:brightness(1.08);}

  .confirm-overlay{position:fixed;inset:0;background:oklch(0.05 0.02 262 / 0.72);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;}
  .confirm-card{background:var(--panel);border:1px solid var(--live-line);border-radius:12px;padding:32px 34px;max-width:420px;width:100%;box-shadow:0 24px 64px oklch(0.05 0.02 262 / 0.55);animation:flashSoldIn 260ms ease-out both;}
  .confirm-title{font-size:22px;font-weight:600;color:var(--text);}
  .confirm-message{font-size:14px;color:var(--text-dim);margin-top:10px;line-height:1.55;}
  .btn-success{background:var(--success);color:oklch(0.1 0.02 145);}

  .stat-tile{flex:1 1 130px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:13px 18px;}
  .stat-label{font-size:11px;color:var(--text-faint);letter-spacing:0.05em;}
  .stat-value{font-size:25px;font-weight:600;margin-top:3px;}

  .team-name-dot{display:inline-flex;align-items:center;gap:8px;}

  .queue-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:6px;}
  .queue-row.is-current{background:var(--gold-soft);}
  .queue-row:hover{background:var(--panel-2);}
  .queue-status{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .queue-meta{font-size:12px;color:var(--text-faint);margin-top:1px;}

  .tag{font-size:11px;font-weight:700;letter-spacing:0.06em;border-radius:4px;padding:5px 10px;}
  .tag-gold{color:var(--gold);background:var(--gold-soft);}

  /* view-specific layout */
  .cols{display:flex;gap:28px;align-items:flex-start;}
  .grow{flex:1;min-width:0;}
  .col-narrow{flex:0 0 340px;}
  .col-wide{flex:0 0 440px;}

  /* ---- mobile responsive ---- */
  @media (max-width: 860px){
    #topbar{flex-wrap:wrap;height:auto;padding:12px 16px;gap:10px;row-gap:8px;}
    .brand{gap:8px;flex-wrap:wrap;row-gap:4px;}
    .brand-name{font-size:12.5px;letter-spacing:0.01em;}
    .status-pill{font-size:11px;padding:5px 10px;}
    .topbar-right{gap:8px;flex-wrap:wrap;}
    .role-label{font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .switch-btn{padding:8px 12px;font-size:12px;}

    #view-root{padding:14px 14px 28px;}
    .cols{flex-direction:column;gap:16px;}
    .col-narrow,.col-wide,.grow{flex:1 1 100%;width:100%;}
    .admin-fixed-h{height:auto !important;max-height:64vh;}

    .gate-card{padding:34px 22px;}
    .gate-title{font-size:32px;}
    .gate-eyebrow{font-size:11px;}
    .team-grid{grid-template-columns:1fr;}

    .panel-head{padding:13px 16px 11px;flex-wrap:wrap;row-gap:8px;}
    .stat-tile{flex:1 1 42%;}

    .flash-card{padding:22px 26px;max-width:88vw;}
    .flash-name{font-size:28px;}
    .flash-price{font-size:24px;}
    #flash-overlay{padding-top:6vh;}
  }
  @media (max-width: 480px){
    .stat-tile{flex:1 1 100%;}
  }
</style>
</head>

        cb({ id:id, exists: data!==undefined, data:function(){ return data; } });
      });
    }
    function notifyCol(collection){
      (colListeners[collection]||[]).forEach(function(cb){
        var obj = cache[collection]||{};
        var ids = Object.keys(obj);
        var docs = ids.map(function(id){ return {id:id, exists:true, data:function(){ return obj[id]; }}; });
        cb({ docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){ return []; } });
      });
    }

    var es = new EventSource('/api/stream');
    es.onmessage = function(ev){
      var msg = JSON.parse(ev.data);
      if(msg.type==='full'){
        cache = msg.store;
        ready = true;
        Object.keys(docListeners).forEach(function(key){
          var parts = key.split('/');
          notifyDoc(parts[0], parts.slice(1).join('/'));
        });
        Object.keys(colListeners).forEach(notifyCol);
      } else if(msg.type==='doc'){
        ensureCol(msg.collection);
        cache[msg.collection][msg.id] = msg.data;
        notifyDoc(msg.collection, msg.id);
        notifyCol(msg.collection);
      }
    };

    function writeOp(op, fullPath, data){
      return fetch('/api/write', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({op:op, path:fullPath, data:data})
      }).then(function(r){ if(!r.ok) throw new Error('write failed'); });
    }

    function docRef(fullPath){
      var parts = fullPath.split('/');
      var collection = parts[0], id = parts.slice(1).join('/');
      return {
        id: id,
        path: fullPath,
        get: function(){
          return Promise.resolve({
            id:id, exists: !!(cache[collection] && cache[collection][id]!==undefined),
            data: function(){ return cache[collection] ? cache[collection][id] : undefined; }
          });
        },
        set: function(data){
          ensureCol(collection); cache[collection][id]=data;
          notifyDoc(collection,id); notifyCol(collection);
          return writeOp('set', fullPath, data);
        },
        update: function(data){
          ensureCol(collection);
          var cur = cache[collection][id] || {};
          var merged = JSON.parse(JSON.stringify(cur));
          deepMergeLocal(merged, data);
          cache[collection][id] = merged;
          notifyDoc(collection,id); notifyCol(collection);
          return writeOp('update', fullPath, data);
        },
        onSnapshot: function(next){
          var key = collection+'/'+id;
          (docListeners[key] = docListeners[key]||[]).push(next);
          if(ready) notifyDoc(collection,id);
          return function(){ docListeners[key] = (docListeners[key]||[]).filter(function(f){return f!==next;}); };
        },
        collection: function(sub){ return collectionRef(fullPath+'/'+sub); }
      };
    }
    function collectionRef(colPath){
      return {
        path: colPath,
        doc: function(id){ return docRef(colPath+'/'+id); },
        onSnapshot: function(next){
          (colListeners[colPath] = colListeners[colPath]||[]).push(next);
          if(ready) notifyCol(colPath);
          return function(){ colListeners[colPath] = (colListeners[colPath]||[]).filter(function(f){return f!==next;}); };
        }
      };
    }
    return { doc: docRef, collection: collectionRef };
  }

  function detectAuctionTransitions(prev, next){
    if(!prev || !next) return;
    if(!state.loaded.players || !state.loaded.teams) return;
    if(next.lastPlayerId && (next.lastPlayerId!==prev.lastPlayerId || next.lastResolution!==prev.lastResolution)){
      var p = state.players[next.lastPlayerId];
      var pname = p ? p.name : 'Player';
      if(next.lastResolution==='sold'){
        var team = prev.currentBidTeamId ? state.teams[prev.currentBidTeamId] : null;
        showSoldFlash(pname, team, prev.currentBid);
        speak(pname+' sold to '+(team?team.name:'a franchise')+' for '+prev.currentBid+' points');
      } else if(next.lastResolution==='unsold'){
        showUnsoldFlash(pname);
        speak(pname+' is unsold');
      }
      return;
    }
    if(next.currentPlayerId && next.currentPlayerId===prev.currentPlayerId && next.currentBid>(prev.currentBid||0)){
      triggerBidPulse();
      var bidPlayer = state.players[next.currentPlayerId];
      var bidTeam = next.currentBidTeamId ? state.teams[next.currentBidTeamId] : null;
      if(bidPlayer && bidTeam){
        speak(bidTeam.name+' bids '+next.currentBid+' for '+bidPlayer.name, true);
      }
    }
  }

  function teamLotCount(team, lot){ return (team.roster||[]).filter(function(r){return r.lot===lot;}).length; }
  function purseRemaining(team){ return team.purseTotal - team.purseSpent; }
  function rosterCount(team){ return (team.roster||[]).length; }

  function mandatoryReserve(team, pendingLot){
    var cfg = state.config;
    var total = 0, gaps = [];
    Object.keys(cfg.lots).forEach(function(lotId){
      var meta = cfg.lots[lotId];
      var need = meta.quotaPerTeam - teamLotCount(team, lotId);
      if(lotId === pendingLot) need -= 1;
      need = Math.max(0, need);
      if(need > 0){
        total += need * meta.basePrice;
        gaps.push(need+' from '+meta.label);
      }
    });
    return {total: total, gaps: gaps};
  }
  function reserveWarningHtml(team){
    var reserve = mandatoryReserve(team, null);
    if(reserve.total <= 0) return '';
    var safeToSpend = Math.max(0, purseRemaining(team) - reserve.total);
    return '<div class="panel" style="background:var(--gold-soft);border:1px solid var(--gold-line);padding:18px 22px;">'+
      '<div style="display:flex;align-items:center;gap:9px;">'+
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17.5v.01"/></svg>'+
        '<span class="disp" style="font-weight:700;letter-spacing:0.05em;font-size:13px;color:var(--gold);">BUDGET RESERVE</span>'+
      '</div>'+
      '<div style="font-size:14px;color:var(--text);margin-top:10px;">Still must buy: <b>'+esc(reserve.gaps.join(', '))+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:1px solid var(--gold-line);">'+
        '<span style="font-size:12.5px;color:var(--text-dim);">Safe to spend on anything else right now</span>'+
        '<span class="disp num" style="font-size:24px;font-weight:700;color:var(--gold);">'+money(safeToSpend)+' pts</span>'+
      '</div>'+
    '</div>';
  }
  function nextBidAmount(){
    var a = state.auction;
    if(!a.currentBidTeamId) return a.currentBid;
    return a.currentBid + state.config.increment;
  }
  function queueOrder(){
    if(!state.config) return [];
    var list = [];
    state.config.lotOrder.forEach(function(lot){
      var players = Object.keys(state.players).filter(function(id){return state.players[id].lot===lot;});
      players.sort(function(a,b){ return state.players[a].order - state.players[b].order; });
      list = list.concat(players);
    });
    return list;
  }
  function nextQueuedPlayerId(){
    var order = queueOrder();
    for(var i=0;i<order.length;i++){ if(state.players[order[i]].status==='queued') return order[i]; }
    return null;
  }
  function canBid(teamId){
    var a = state.auction, cfg = state.config;
    if(!cfg || !a || a.status!=='live' || !a.currentPlayerId) return {ok:false, reason:'No player is currently up for auction.'};
    var player = state.players[a.currentPlayerId];
    if(!player) return {ok:false, reason:'No player is currently up for auction.'};
    var team = state.teams[teamId];
    if(a.currentBidTeamId===teamId) return {ok:false, reason:'You already hold the leading bid.'};
    var meta = lotMeta(player.lot);
    if(teamLotCount(team, player.lot) >= meta.quotaPerTeam) return {ok:false, reason:'You already have your '+meta.label+' pick'+(meta.quotaPerTeam>1?'s':'')+'.'};
    if(rosterCount(team) >= 9) return {ok:false, reason:'Your squad is already full.'};
    var amount = nextBidAmount();
    var reserve = mandatoryReserve(team, player.lot);
    if(purseRemaining(team) - amount < reserve.total){
      if(reserve.gaps.length === 0) return {ok:false, reason:'Not enough purse remaining for this bid.'};
      return {ok:false, reason:'Must still buy '+reserve.gaps.join(', ')+' — '+reserve.total+' pts reserved for that.'};
    }
    return {ok:true, amount:amount};
  }

  /* ---------- writes ---------- */
  function setUndo(u){ return CAP.doc('auction/undo').set(u); }
  function clearUndo(){ return CAP.doc('auction/undo').set({type:null, description:null}); }
  function undoLast(){
    var u = state.undo;
    if(!u || !u.type) return;
    var chain = Promise.resolve();
    if(u.team){ chain = chain.then(function(){ return CAP.doc('teams/'+u.team.id).update({roster:u.team.roster, purseSpent:u.team.purseSpent}); }); }
    if(u.player){ chain = chain.then(function(){ return CAP.doc('players/'+u.player.id).update({status:u.player.status, soldTo:u.player.soldTo, price:u.player.price}); }); }
    if(u.auction){ chain = chain.then(function(){ return CAP.doc('auction/state').update(u.auction); }); }
    if(u.activityEntries){ chain = chain.then(function(){ return CAP.doc('activity/log').set({entries:u.activityEntries}); }); }
    chain.then(clearUndo);
  }
  function placeBid(teamId){
    var check = canBid(teamId);
    if(!check.ok) return;
    var a = state.auction;
    var teamName = state.teams[teamId].name;
    var prevAuction = {currentPlayerId:a.currentPlayerId, currentBid:a.currentBid, currentBidTeamId:a.currentBidTeamId, bidHistory:(a.bidHistory||[]).slice()};
    var newHistory = (a.bidHistory||[]).concat([{teamId:teamId, amount:check.amount}]);
    CAP.doc('auction/state').update({currentBid:check.amount, currentBidTeamId:teamId, bidHistory:newHistory})
      .then(function(){
        return setUndo({
          type:'bid',
          description:'bid of '+check.amount+' pts recorded for '+teamName,
          auction:prevAuction
        });
      });
  }
  function pushActivity(text){
    var entries = [{ts:Date.now(), text:text}].concat(state.activity||[]).slice(0,20);
    return CAP.doc('activity/log').set({entries:entries});
  }
  function setCurrentPlayer(playerId){
    var reverts = Object.keys(state.players).filter(function(id){
      return id!==playerId && state.players[id].status==='current';
    }).map(function(id){
      return CAP.doc('players/'+id).update({status:'queued'});
    });
    var player = state.players[playerId];
    var meta = lotMeta(player.lot);
    return Promise.all(reverts)
      .then(function(){ return CAP.doc('players/'+playerId).update({status:'current'}); })
      .then(function(){ return CAP.doc('auction/state').update({status:'live', currentPlayerId:playerId, currentBid:meta.basePrice, currentBidTeamId:null, bidHistory:[]}); });
  }
  function nextPlayer(){
    var id = nextQueuedPlayerId();
    if(!id){
      return CAP.doc('auction/state').update({status:'ended', currentPlayerId:null, currentBid:0, currentBidTeamId:null, bidHistory:[]});
    }
    return setCurrentPlayer(id);
  }
  function startAuction(){ return nextPlayer(); }
  function shuffleQueue(){
    var byLot = {};
    Object.keys(state.players).forEach(function(id){
      var p = state.players[id];
      if(p.status!=='queued') return;
      (byLot[p.lot] = byLot[p.lot] || []).push(id);
    });
    var writes = [];
    Object.keys(byLot).forEach(function(lot){
      var ids = byLot[lot];
      var orders = ids.map(function(id){ return state.players[id].order; });
      for(var i=ids.length-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t=ids[i]; ids[i]=ids[j]; ids[j]=t;
      }
      ids.forEach(function(id, idx){
        writes.push(CAP.doc('players/'+id).update({order:orders[idx]}));
      });
    });
    return Promise.all(writes);
  }
  function resetAuction(){
    showConfirm(
      'Reset the entire auction?',
      'Every bid, sale and purse goes back to the start — captains keep their PINs and squad requirements, but lose any players already bought. This cannot be undone.',
      doResetAuction
    );
  }
  function doResetAuction(){
    var writes = [];
    Object.keys(state.players).forEach(function(id){
      writes.push(CAP.doc('players/'+id).update({status:'queued', soldTo:null, price:null}));
    });
    Object.keys(state.teams).forEach(function(id){
      var t = state.teams[id];
      writes.push(CAP.doc('teams/'+id).update({purseSpent:0, roster:[{playerId:'captain', name:t.name, price:0, lot:'captain'}]}));
    });
    writes.push(CAP.doc('auction/state').set({status:'not_started', currentPlayerId:null, currentBid:0, currentBidTeamId:null, bidHistory:[], lastPlayerId:null, lastResolution:null}));
    writes.push(CAP.doc('activity/log').set({entries:[]}));
    writes.push(CAP.doc('auction/undo').set({type:null, description:null}));
    return Promise.all(writes);
  }
  function markSold(){
    var a = state.auction;
    if(!a.currentPlayerId || !a.currentBidTeamId) return;
    var player = state.players[a.currentPlayerId];
    var team = state.teams[a.currentBidTeamId];
    var meta = lotMeta(player.lot);
    var price = a.currentBid;
    var prevRoster = (team.roster||[]).slice();
    var prevPurseSpent = team.purseSpent;
    var prevActivity = (state.activity||[]).slice();
    var prevAuction = {currentPlayerId:a.currentPlayerId, currentBid:a.currentBid, currentBidTeamId:a.currentBidTeamId, bidHistory:(a.bidHistory||[]).slice()};
    var roster = prevRoster.concat([{playerId:a.currentPlayerId, name:player.name, price:price, lot:player.lot}]);
    CAP.doc('teams/'+a.currentBidTeamId).update({purseSpent: prevPurseSpent+price, roster:roster})
      .then(function(){ return CAP.doc('players/'+a.currentPlayerId).update({status:'sold', soldTo:a.currentBidTeamId, price:price}); })
      .then(function(){ return CAP.doc('auction/state').update({currentPlayerId:null, currentBid:0, currentBidTeamId:null, bidHistory:[], lastPlayerId:a.currentPlayerId, lastResolution:'sold'}); })
      .then(function(){ return pushActivity(team.name+' bought '+player.name+' ('+meta.label+') for '+price+' pts'); })
      .then(function(){
        return setUndo({
          type:'sold',
          description:'sale of '+player.name+' to '+team.name+' for '+price+' pts',
          auction:prevAuction,
          player:{id:a.currentPlayerId, status:'current', soldTo:null, price:null},
          team:{id:a.currentBidTeamId, roster:prevRoster, purseSpent:prevPurseSpent},
          activityEntries:prevActivity
        });
      });
  }
  function markUnsold(){
    var a = state.auction;
    if(!a.currentPlayerId || a.currentBidTeamId) return;
    var player = state.players[a.currentPlayerId];
    var prevAuction = {currentPlayerId:a.currentPlayerId, currentBid:a.currentBid, currentBidTeamId:a.currentBidTeamId, bidHistory:(a.bidHistory||[]).slice()};
    var prevActivity = (state.activity||[]).slice();
    CAP.doc('players/'+a.currentPlayerId).update({status:'unsold'})
      .then(function(){ return CAP.doc('auction/state').update({currentPlayerId:null, currentBid:0, currentBidTeamId:null, bidHistory:[], lastPlayerId:a.currentPlayerId, lastResolution:'unsold'}); })
      .then(function(){ return pushActivity(player.name+' went unsold'); })
      .then(function(){
        return setUndo({
          type:'unsold',
          description:player.name+' marked unsold',
          auction:prevAuction,
          player:{id:a.currentPlayerId, status:'current', soldTo:null, price:null},
          activityEntries:prevActivity
        });
      });
  }

  /* ---------- rendering ---------- */
  function render(){
    if(document.getElementById('app').hidden) return;
    var allLoaded = state.loaded.config && state.loaded.teams && state.loaded.players && state.loaded.auction && state.loaded.activity && state.loaded.undo;
    renderTopbar();
    var root = document.getElementById('view-root');
    if(!allLoaded){ root.innerHTML = '<div class="loading">Loading auction data…</div>'; return; }
    if(role.type==='admin') root.innerHTML = renderAdmin();
    else if(role.type==='captain') root.innerHTML = renderCaptain(role.teamId);
    else root.innerHTML = renderPublic();
  }

  function renderTopbar(){
    var pill = document.getElementById('topbar-status');
    var a = state.auction;
    if(!a){ return; }
    if(a.status==='live'){ pill.className='status-pill status-live live'; pill.innerHTML='<span class="status-dot"></span>LIVE'; }
    else if(a.status==='ended'){ pill.className='status-pill status-done'; pill.innerHTML='<span class="status-dot"></span>COMPLETE'; }
    else { pill.className='status-pill status-idle'; pill.innerHTML='<span class="status-dot"></span>NOT STARTED'; }

    var label = document.getElementById('role-label');
    if(role.type==='admin') label.textContent = 'Admin · Control Room';
    else if(role.type==='captain') label.textContent = 'Captain · ' + (state.teams[role.teamId] ? state.teams[role.teamId].name : role.teamId);
    else label.textContent = 'Public View';

    var ttsBtn = document.getElementById('tts-toggle');
    if(role.type==='public' && ('speechSynthesis' in window)){
      ttsBtn.hidden = false;
      ttsBtn.style.cssText = 'display:flex;align-items:center;gap:7px;';
      ttsBtn.innerHTML = (ttsEnabled ? SPEAKER_ON_SVG : SPEAKER_OFF_SVG) + '<span>' + (ttsEnabled ? 'Announcer on' : 'Announcer off') + '</span>';
    } else {
      ttsBtn.hidden = true;
    }
  }

  function currentPlayerBlock(){
    var a = state.auction;
    var player = a.currentPlayerId ? state.players[a.currentPlayerId] : null;
    var leadTeam = a.currentBidTeamId ? state.teams[a.currentBidTeamId] : null;
    return {player:player, meta: player ? lotMeta(player.lot) : null, leadTeam:leadTeam};
  }

  function teamsSortedByPurse(){
    return teamOrder().map(function(id){ return {id:id, team:state.teams[id]}; })
      .sort(function(a,b){ return purseRemaining(b.team) - purseRemaining(a.team); });
  }

  function purseBoardHtml(highlightId){
    return teamsSortedByPurse().map(function(row){
      var t = row.team, pct = Math.max(0, Math.round(100*purseRemaining(t)/t.purseTotal));
      var isMe = row.id===highlightId;
      return '<div style="margin-bottom:20px;'+(isMe?'background:var(--gold-soft);border-radius:7px;padding:12px;margin:0 -12px 20px;':'')+'">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">'+
          '<span class="team-name-dot" style="font-size:15px;font-weight:'+(isMe?'700':'600')+';"><span class="dot" style="background:var(--'+esc(t.color)+')"></span>'+esc(t.name)+(isMe?' (You)':'')+'</span>'+
          '<span style="font-size:12px;color:var(--text-faint);">'+rosterCount(t)+'/9</span>'+
        '</div>'+
        '<div class="disp num" style="font-size:25px;font-weight:600;">'+money(purseRemaining(t))+' <span style="font-size:12px;font-weight:400;color:var(--text-faint);font-family:Manrope,sans-serif;">pts left</span></div>'+
        '<div style="height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:8px;"><div style="width:'+pct+'%;height:100%;background:var(--'+esc(t.color)+');"></div></div>'+
      '</div>';
    }).join('');
  }

  function activityHtml(limit){
    var items = (state.activity||[]).slice(0, limit||8);
    if(items.length===0) return '<div style="font-size:13px;color:var(--text-faint);padding:10px 0;">No sales yet.</div>';
    return items.map(function(e){
      return '<div style="font-size:13.5px;color:var(--text-dim);padding:10px 0;border-bottom:1px solid var(--border-soft);">'+esc(e.text)+'</div>';
    }).join('');
  }

  function upcomingHtml(limit, excludeCurrent){
    var order = queueOrder().filter(function(id){ return state.players[id].status==='queued'; });
    return order.slice(0, limit).map(function(id){
      var p = state.players[id], meta = lotMeta(p.lot);
      return '<div class="queue-row"><span class="queue-status" style="background:var(--text-faint);"></span>'+
        '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">'+esc(p.name)+'</div>'+
        '<div class="queue-meta">'+esc(meta.label)+' · base '+money(meta.basePrice)+'</div></div></div>';
    }).join('');
  }

  function bidTrailHtml(){
    var hist = (state.auction.bidHistory||[]);
    if(hist.length===0) return '';
    var chips = hist.map(function(h, idx){
      var t = state.teams[h.teamId];
      var isLast = idx===hist.length-1;
      var style = isLast
        ? 'font-size:14px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:5px;padding:7px 14px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;'
        : 'font-size:14px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:7px 14px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;';
      return '<span style="'+style+'"><span class="dot" style="background:var(--'+esc(t.color)+')"></span>'+money(h.amount)+' '+esc(t.name)+'</span>';
    }).join('');
    return '<div style="display:flex;align-items:center;gap:10px;margin-top:24px;overflow-x:auto;padding-bottom:4px;">'+
      '<span style="font-size:12px;color:var(--text-faint);letter-spacing:0.06em;flex:0 0 auto;">BID TRAIL</span>'+chips+'</div>';
  }

  /* ---------- PUBLIC ---------- */
  function renderPublic(){
    var cur = currentPlayerBlock();
    var heroInner, heroPanelStyle;
    if(cur.player){
      var leadName = cur.leadTeam ? esc(cur.leadTeam.name) : 'No bids yet';
      var leadColor = cur.leadTeam ? 'var(--'+esc(cur.leadTeam.color)+')' : 'var(--text-faint)';
      heroPanelStyle = 'padding:clamp(28px,5vw,56px) clamp(22px,6vw,60px);min-height:420px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:clamp(20px,4vw,40px);';
      heroInner =
        '<div style="flex:2 1 320px;min-width:0;">'+
          lotTagHtml(cur.player.lot)+
          '<div class="disp" style="font-size:clamp(34px,8vw,76px);font-weight:600;margin-top:18px;line-height:1.05;">'+esc(cur.player.name)+'</div>'+
          '<div style="display:flex;flex-wrap:wrap;gap:clamp(24px,6vw,64px);margin-top:clamp(20px,4vw,38px);">'+
            '<div><div style="font-size:12.5px;color:var(--text-faint);letter-spacing:0.06em;">BASE PRICE</div><div class="disp num" style="font-size:clamp(17px,3vw,24px);font-weight:600;color:var(--text-dim);margin-top:4px;">'+money(cur.meta.basePrice)+' pts</div></div>'+
            '<div><div style="font-size:12.5px;color:var(--gold);letter-spacing:0.06em;font-weight:700;">CURRENT BID</div><div class="disp num'+(pulseFlag?' bid-pulse':'')+'" style="font-size:clamp(30px,7.5vw,72px);font-weight:700;color:var(--gold);line-height:1.1;">'+money(state.auction.currentBid)+' pts</div>'+
              '<div class="disp" style="display:inline-flex;align-items:center;gap:12px;font-size:clamp(16px,3.5vw,27px);font-weight:600;color:'+leadColor+';background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:clamp(9px,2vw,13px) clamp(14px,3vw,22px);margin-top:clamp(10px,2vw,18px);"><span class="dot" style="background:'+leadColor+';width:15px;height:15px;"></span>'+leadName+'</div></div>'+
          '</div>'+
          bidTrailHtml()+
        '</div>'+
        '<div style="flex:1 1 140px;display:flex;flex-direction:column;align-items:center;max-width:240px;">'+
          '<div style="color:oklch(0.50 0.11 85);opacity:0.6;width:clamp(100px,26vw,240px);">'+lotIconSvg(cur.meta.icon,'100%',0.8)+'</div>'+
          '<div class="disp" style="font-size:14px;letter-spacing:0.1em;color:oklch(0.55 0.02 262);text-align:center;margin-top:12px;text-transform:uppercase;">'+esc(cur.meta.tierName||'')+'</div>'+
        '</div>';
    } else if(state.auction.status==='ended'){
      heroPanelStyle = 'padding:clamp(28px,5vw,56px) clamp(22px,6vw,60px);min-height:420px;display:flex;flex-direction:column;justify-content:center;';
      heroInner = '<div class="disp" style="font-size:clamp(28px,6vw,52px);font-weight:600;">Auction complete</div><div style="color:var(--text-dim);margin-top:10px;font-size:15px;">All lots have been sold or passed.</div>';
    } else {
      heroPanelStyle = 'padding:clamp(28px,5vw,56px) clamp(22px,6vw,60px);min-height:420px;display:flex;flex-direction:column;justify-content:center;';
      heroInner = '<div class="disp" style="font-size:clamp(26px,5.5vw,46px);font-weight:600;">Waiting for the next player…</div><div style="color:var(--text-dim);margin-top:10px;font-size:15px;">The admin will bring up the next lot shortly.</div>';
    }
    return '<div class="cols">'+
      '<div class="grow">'+
        '<div class="panel" style="'+heroPanelStyle+'">'+heroInner+'</div>'+
        '<div class="panel" style="margin-top:24px;">'+
          '<div class="panel-head"><span class="panel-title">RECENT ACTIVITY</span></div>'+
          '<div style="padding:10px 24px 20px;font-size:14px;">'+activityHtml(6)+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="col-wide panel">'+
        '<div class="panel-head"><span class="panel-title">FRANCHISE PURSE BOARD</span></div>'+
        '<div style="padding:20px 24px;">'+purseBoardHtml(null)+'</div>'+
      '</div>'+
    '</div>';
  }

  /* ---------- CAPTAIN ---------- */
  function renderCaptain(teamId){
    var team = state.teams[teamId];
    var cur = currentPlayerBlock();
    var amILeading = cur.leadTeam && cur.leadTeam===team;

    var bidBlock;
    if(!cur.player){
      bidBlock = '<div style="padding:56px 30px;text-align:center;color:var(--text-dim);font-size:16px;">'+
        (state.auction.status==='ended' ? 'Auction complete — thanks for playing.' : 'No player is currently up. Waiting for the admin…')+'</div>';
    } else {
      bidBlock =
        '<div style="padding:clamp(22px,5vw,36px) clamp(18px,5vw,40px);">'+
          '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;">'+
            '<div>'+lotTagHtml(cur.player.lot)+
              '<div class="disp" style="font-size:clamp(26px,7vw,42px);font-weight:600;margin-top:12px;">'+esc(cur.player.name)+'</div></div>'+
            '<div style="text-align:right;"><div style="font-size:12px;color:var(--text-faint);">BASE '+money(cur.meta.basePrice)+'</div></div>'+
          '</div>'+
          '<div style="display:flex;align-items:center;gap:20px;margin-top:26px;background:'+(amILeading?'var(--success-soft)':'var(--gold-soft)')+';border-radius:8px;padding:clamp(16px,4vw,22px) clamp(18px,4vw,26px);">'+
            '<div style="flex:1;"><div style="font-size:12px;color:var(--text-faint);">CURRENT BID</div>'+
              '<div class="disp num'+(pulseFlag?' bid-pulse':'')+'" style="font-size:clamp(30px,8vw,46px);font-weight:700;color:'+(amILeading?'var(--success)':'var(--gold)')+';">'+money(state.auction.currentBid)+' pts</div>'+
              '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;">'+(cur.leadTeam ? (amILeading?'You are leading':esc(cur.leadTeam.name)+' is leading') : 'No bids yet')+'</div>'+
            '</div>'+
          '</div>'+
          '<div style="font-size:13px;color:var(--text-faint);margin-top:16px;">Call out your bid in the room — the organizer records it here.</div>'+
        '</div>';
    }

    var roster = team.roster||[];
    var rosterRows = roster.map(function(r){
      var meta = r.lot==='captain' ? {label:'Captain'} : lotMeta(r.lot);
      return '<div style="display:grid;grid-template-columns:1fr clamp(64px,20vw,130px) clamp(60px,18vw,110px);gap:8px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--border-soft);">'+
        '<span style="font-size:clamp(13px,3vw,15px);font-weight:600;">'+esc(r.name)+'</span>'+
        '<span style="font-size:13px;color:var(--text-dim);">'+esc(meta.label)+'</span>'+
        '<span class="disp num" style="text-align:right;font-weight:600;font-size:15px;">'+(r.lot==='captain'?'—':money(r.price))+'</span>'+
      '</div>';
    }).join('');

    return '<div class="cols">'+
      '<div class="grow" style="display:flex;flex-direction:column;gap:24px;">'+
        '<div class="panel">'+bidBlock+'</div>'+
        reserveWarningHtml(team)+
        '<div class="panel">'+
          '<div class="panel-head"><span class="panel-title">MY SQUAD · '+roster.length+'/9</span></div>'+
          '<div style="padding:6px 24px;">'+rosterRows+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="col-wide" style="display:flex;flex-direction:column;gap:24px;">'+
        '<div class="panel" style="padding:24px 26px;">'+
          '<div class="panel-title" style="margin-bottom:14px;">PURSE BREAKDOWN</div>'+
          '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;"><span style="color:var(--text-dim);">Total budget</span><span class="disp num" style="font-weight:600;">'+money(team.purseTotal)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;"><span style="color:var(--text-dim);">Spent so far</span><span class="disp num" style="font-weight:600;">'+money(team.purseSpent)+'</span></div>'+
          '<div style="height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin:12px 0 14px;"><div style="width:'+Math.min(100,Math.round(100*team.purseSpent/team.purseTotal))+'%;height:100%;background:var(--gold);"></div></div>'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:14px;font-weight:700;">Remaining</span><span class="disp num" style="font-size:26px;font-weight:700;color:var(--gold);">'+money(purseRemaining(team))+'</span></div>'+
        '</div>'+
        '<div class="panel">'+
          '<div class="panel-head"><span class="panel-title">PURSE RANKING</span></div>'+
          '<div style="padding:18px 24px;">'+purseBoardHtml(teamId)+'</div>'+
        '</div>'+
        '<div class="panel">'+
          '<div class="panel-head"><span class="panel-title">AUCTION ACTIVITY</span></div>'+
          '<div style="padding:8px 24px 18px;font-size:14px;">'+activityHtml(8)+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  /* ---------- ADMIN ---------- */
  function renderAdmin(){
    var a = state.auction, cur = currentPlayerBlock();
    var totalPlayers = Object.keys(state.players).length;
    var sold = Object.values(state.players).filter(function(p){return p.status==='sold';});
    var unsold = Object.values(state.players).filter(function(p){return p.status==='unsold';}).length;
    var remaining = Object.values(state.players).filter(function(p){return p.status==='queued'||p.status==='current';}).length;
    var totalSpent = sold.reduce(function(s,p){return s+(p.price||0);},0);
    var avgPrice = sold.length ? Math.round(totalSpent/sold.length) : 0;

    var primaryControl;
    if(a.status==='not_started'){
      primaryControl = '<button class="btn btn-gold" data-action="start-auction">Start Auction</button>';
    } else {
      primaryControl = '<button class="btn btn-line" data-action="next-player">Next Player →</button>';
    }
    var controls = '<div style="display:flex;flex-direction:column;gap:8px;align-items:stretch;">'+primaryControl+
      '<button class="btn btn-danger-line" style="font-size:12px;padding:8px 14px;" data-action="reset-auction">Reset Auction</button></div>';

    var lotControl;
    if(cur.player){
      lotControl =
        '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;">'+
          '<span class="panel-title">CURRENT LOT</span>'+lotTagHtml(cur.player.lot)+
        '</div>'+
        '<div class="disp" style="font-size:clamp(26px,6vw,36px);font-weight:600;margin-top:10px;line-height:1.1;">'+esc(cur.player.name)+'</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;">'+
          '<div style="flex:1;"><div style="font-size:11.5px;color:var(--text-faint);margin-bottom:5px;">BASE PRICE</div><div class="panel-2 disp num" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:17px;font-weight:600;">'+money(cur.meta.basePrice)+'</div></div>'+
          '<div style="flex:1;"><div style="font-size:11.5px;color:var(--text-faint);margin-bottom:5px;">INCREMENT</div><div class="disp num" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:17px;font-weight:600;">'+money(state.config.increment)+'</div></div>'+
        '</div>'+
        '<div style="margin-top:14px;">'+
          '<div style="font-size:11.5px;color:var(--gold);font-weight:700;margin-bottom:5px;">CURRENT BID</div>'+
          '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:7px;padding:13px 18px;">'+
            '<span class="disp num'+(pulseFlag?' bid-pulse':'')+'" style="font-size:clamp(26px,6vw,34px);font-weight:700;color:var(--gold);flex:1;">'+money(a.currentBid)+'</span>'+
            (cur.leadTeam ? '<span style="display:flex;align-items:center;gap:8px;font-size:13px;background:var(--panel-2);border-radius:5px;padding:7px 14px;"><span class="dot" style="background:var(--'+esc(cur.leadTeam.color)+')"></span>'+esc(cur.leadTeam.name)+'</span>' : '<span style="font-size:12.5px;color:var(--text-faint);">No bids yet</span>')+
          '</div>'+
        '</div>'+
        '<div style="margin-top:16px;">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'+
            '<span class="panel-title" style="letter-spacing:0.06em;">RECORD A BID</span>'+
            '<span style="font-size:11.5px;color:var(--text-faint);">tap the team that called '+money(nextBidAmount())+'</span>'+
          '</div>'+
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;">'+
            teamOrder().map(function(id){
              var t = state.teams[id], c = canBid(id);
              return '<button class="btn btn-line" data-action="place-bid" data-id="'+id+'" '+(c.ok?'':'disabled')+
                (c.ok?'':' title="'+esc(c.reason)+'"')+
                ' style="display:flex;align-items:center;gap:9px;justify-content:flex-start;padding:11px 14px;font-size:13.5px;'+
                (id===a.currentBidTeamId?'border-color:var(--success);color:var(--success);background:var(--success-soft);':'')+'">'+
                '<span class="dot" style="background:var(--'+esc(t.color)+')"></span>'+esc(t.name)+
                (id===a.currentBidTeamId?' <span style="font-size:10px;color:inherit;opacity:0.8;margin-left:auto;">LEADING</span>':'')+
              '</button>';
            }).join('')+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:12px;margin-top:16px;">'+
          '<button class="btn btn-success" style="flex:1;min-height:48px;font-size:14px;" data-action="mark-sold" '+(cur.leadTeam?'':'disabled')+'>MARK SOLD</button>'+
          '<button class="btn btn-danger-line" style="flex:1;min-height:48px;font-size:14px;" data-action="mark-unsold" '+(cur.leadTeam?'disabled title="A bid is already on the table — mark sold or undo the bid first."':'')+'>MARK UNSOLD</button>'+
        '</div>';
    } else {
      lotControl = '<div style="text-align:center;color:var(--text-dim);font-size:15px;padding:50px 10px;">'+
        (a.status==='ended' ? 'All lots resolved.' : 'No player selected yet — click Start Auction, or pick one from the queue.')+'</div>';
    }

    var queueHtml = state.config.lotOrder.map(function(lot){
      var meta = lotMeta(lot);
      var players = Object.keys(state.players).filter(function(id){return state.players[id].lot===lot;})
        .sort(function(x,y){return state.players[x].order-state.players[y].order;});
      var rows = players.map(function(id){
        var p = state.players[id];
        var color = p.status==='sold' ? 'var(--success)' : p.status==='unsold' ? 'var(--text-faint)' : p.status==='current' ? 'var(--live)' : 'var(--text-faint)';
        var metaText = p.status==='sold' ? (state.teams[p.soldTo].name+' · '+money(p.price)) : p.status==='unsold' ? 'Unsold' : p.status==='current' ? 'On the block' : 'base '+money(meta.basePrice);
        var clickable = p.status==='queued' ? ' data-action="set-current" data-id="'+id+'" style="cursor:pointer;"' : '';
        return '<div class="queue-row"'+clickable+'><span class="queue-status" style="background:'+color+';"></span>'+
          '<div style="flex:1;min-width:0;"><div style="font-size:14px;'+(p.status==='sold'||p.status==='unsold'?'opacity:0.6;':'')+'">'+esc(p.name)+'</div>'+
          '<div class="queue-meta">'+esc(metaText)+'</div></div></div>';
      }).join('');
      return '<div style="margin-bottom:10px;"><div style="font-size:12px;letter-spacing:0.07em;color:var(--text-faint);padding:14px 10px 4px;display:flex;align-items:center;gap:6px;">'+lotIconSvg(meta.icon,12)+esc(meta.label).toUpperCase()+'</div>'+rows+'</div>';
    }).join('');

    var teamsRows = teamOrder().map(function(id){
      var t = state.teams[id];
      return '<div style="display:grid;grid-template-columns:1fr clamp(60px,20vw,110px) clamp(40px,14vw,70px);gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border-soft);">'+
        '<span class="team-name-dot" style="font-size:14.5px;"><span class="dot" style="background:var(--'+esc(t.color)+')"></span>'+esc(t.name)+'</span>'+
        '<span class="disp num" style="text-align:right;font-weight:600;font-size:16px;">'+money(purseRemaining(t))+'</span>'+
        '<span style="text-align:right;font-size:13px;color:var(--text-faint);">'+rosterCount(t)+'/9</span>'+
      '</div>';
    }).join('');

    var undoBanner = (state.undo && state.undo.type) ?
      '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--live-soft);border:1px solid var(--live-line);border-radius:8px;padding:14px 22px;">'+
        '<span style="font-size:14px;color:oklch(0.85 0.1 25);">Last action: '+esc(state.undo.description)+'</span>'+
        '<button class="btn btn-line" data-action="undo-last" style="padding:9px 18px;">Undo</button>'+
      '</div>' : '';

    return '<div style="display:flex;flex-direction:column;gap:16px;">'+
      undoBanner+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;">'+
        '<div class="stat-tile"><div class="stat-label">PLAYERS SOLD</div><div class="disp stat-value">'+sold.length+'</div></div>'+
        '<div class="stat-tile"><div class="stat-label">TOTAL SPENT</div><div class="disp stat-value">'+money(totalSpent)+'</div></div>'+
        '<div class="stat-tile"><div class="stat-label">UNSOLD</div><div class="disp stat-value">'+unsold+'</div></div>'+
        '<div class="stat-tile"><div class="stat-label">REMAINING</div><div class="disp stat-value">'+remaining+'</div></div>'+
        '<div class="stat-tile"><div class="stat-label">AVG. PRICE</div><div class="disp stat-value">'+money(avgPrice)+'</div></div>'+
        '<div class="stat-tile" style="display:flex;align-items:center;justify-content:center;">'+controls+'</div>'+
      '</div>'+
      '<div class="cols" style="flex:1;min-height:0;">'+
        '<div class="col-narrow panel admin-fixed-h" style="height:600px;display:flex;flex-direction:column;">'+
          '<div class="panel-head"><span class="panel-title">PLAYER QUEUE</span>'+
            '<button class="btn btn-line" data-action="shuffle-queue" style="padding:7px 14px;font-size:12px;display:flex;align-items:center;gap:7px;" title="Randomizes player order within each lot. Lots themselves stay in order.">'+
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 20.5 3.5M21 16v5h-5M15 15l5.5 5.5M4 4l5 5"/></svg>Shuffle'+
            '</button>'+
          '</div>'+
          '<div style="flex:1;overflow-y:auto;padding:6px 12px;min-height:0;">'+queueHtml+'</div>'+
        '</div>'+
        '<div class="grow panel admin-fixed-h" style="height:600px;padding:26px 30px;overflow-y:auto;">'+lotControl+'</div>'+
        '<div class="col-wide panel admin-fixed-h" style="height:600px;display:flex;flex-direction:column;">'+
          '<div class="panel-head"><span class="panel-title">FRANCHISES</span></div>'+
          '<div style="flex:1;overflow-y:auto;padding:2px 24px;min-height:0;">'+teamsRows+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  /* ---------- gate password step ---------- */
  var pendingSelection = null;
  function showGatePasswordStep(title, sub){
    document.getElementById('gate-root').hidden = true;
    var step = document.getElementById('gate-password-step');
    step.hidden = false;
    document.getElementById('gate-pw-title').textContent = title;
    document.getElementById('gate-pw-sub').textContent = sub;
    var input = document.getElementById('gate-pw-input');
    input.value = '';
    document.getElementById('gate-pw-error').textContent = '';
    setTimeout(function(){ input.focus(); }, 30);
  }
  function hideGatePasswordStep(){
    document.getElementById('gate-root').hidden = false;
    document.getElementById('gate-password-step').hidden = true;
    pendingSelection = null;
  }
  function submitGatePassword(){
    if(!pendingSelection) return;
    var errorEl = document.getElementById('gate-pw-error');
    if(!state.loaded.config || !state.loaded.teams){ errorEl.textContent = 'Still loading — try again in a moment.'; return; }
    var entered = document.getElementById('gate-pw-input').value.trim();
    var expected = null;
    if(pendingSelection.type==='admin'){ expected = state.config.adminPassword; }
    else if(pendingSelection.type==='captain'){
      var team = state.teams[pendingSelection.teamId];
      expected = team ? team.password : null;
    }
    if(expected!=null && entered===String(expected)){
      role = pendingSelection.type==='admin' ? {type:'admin'} : {type:'captain', teamId:pendingSelection.teamId};
      saveRole(role);
      pendingSelection = null;
      showApp();
    } else {
      errorEl.textContent = 'Incorrect code — try again.';
      var input = document.getElementById('gate-pw-input');
      input.value = '';
      input.focus();
    }
  }

  /* ---------- events ---------- */
  document.getElementById('confirm-overlay').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.dataset.action==='confirm-cancel') hideConfirm();
    else if(el.dataset.action==='confirm-ok'){
      var fn = confirmCallback;
      hideConfirm();
      if(fn) fn();
    }
  });
  document.getElementById('role-gate').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    if(action==='gate-admin'){ pendingSelection={type:'admin'}; showGatePasswordStep('Admin Access', 'Enter the admin access code.'); }
    else if(action==='gate-public'){ role={type:'public'}; saveRole(role); primeSpeech(); showApp(); }
    else if(action==='gate-captain'){
      var teamName = state.teams[id] ? state.teams[id].name : 'Captain';
      pendingSelection={type:'captain', teamId:id};
      showGatePasswordStep(teamName, 'Enter '+teamName+'’s access code.');
    }
    else if(action==='gate-pw-back') hideGatePasswordStep();
    else if(action==='gate-pw-submit') submitGatePassword();
  });
  document.getElementById('gate-pw-input').addEventListener('keydown', function(e){
    if(e.key==='Enter') submitGatePassword();
  });
  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    if(action==='switch-role') clearRole();
    else if(action==='place-bid') placeBid(id);
    else if(action==='mark-sold') markSold();
    else if(action==='mark-unsold') markUnsold();
    else if(action==='next-player') nextPlayer();
    else if(action==='start-auction') startAuction();
    else if(action==='set-current') setCurrentPlayer(id);
    else if(action==='undo-last') undoLast();
    else if(action==='shuffle-queue') shuffleQueue();
    else if(action==='reset-auction') resetAuction();
    else if(action==='toggle-tts') toggleTts();
  });

  /* ---------- init ---------- */
  async function init(){
    role = loadRole();
    CAP = makeLocalDB();
    CAP.doc('config/main').onSnapshot(function(s){ state.config=s.data(); state.loaded.config=true; render(); renderGateTeamList(); });
    CAP.collection('teams').onSnapshot(function(qs){
      var t={}; qs.docs.forEach(function(d){ t[d.id]=d.data(); }); state.teams=t; state.loaded.teams=true; render(); renderGateTeamList();
    });
    CAP.collection('players').onSnapshot(function(qs){
      var p={}; qs.docs.forEach(function(d){ p[d.id]=d.data(); }); state.players=p; state.loaded.players=true; render();
    });
    CAP.doc('auction/state').onSnapshot(function(s){
      var next = s.data() || {status:'not_started', currentPlayerId:null, currentBid:0, currentBidTeamId:null, bidHistory:[]};
      var prev = state.auction;
      state.auction = next;
      state.loaded.auction=true; render();
      detectAuctionTransitions(prev, next);
    });
    CAP.doc('activity/log').onSnapshot(function(s){
      state.activity = (s.data() && s.data().entries) || []; state.loaded.activity=true; render();
    });
    CAP.doc('auction/undo').onSnapshot(function(s){
      state.undo = s.data() || {type:null, description:null}; state.loaded.undo=true; render();
    });

    if(role){ showApp(); } else { showGate(); }
  }
  init();
})();
</script>

</body>
